name: Deploy to GitHub Pages

# push-only, never pull_request -- this repo takes public contributions, and
# a fork's PR must never be able to trigger a workflow that deploys the site.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build-embeddings
      - name: Stage site
        run: |
          mkdir -p dist/data
          cp index.html dist/
          cp data/statements.csv data/embeddings.bin data/embeddings-manifest.json dist/data/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
