<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion-Tracking Measures in XR-Based Experimental Psychology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eee7; --panel:#f3f6f1; --line:#c3cdbd; --line-strong:#7c8f74;
  --fg:#252e22; --muted:#5e6d55; --accent:#3c5a45; --accent-fg:#f3f6f1; --tag:#1e5183;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Public Sans",system-ui,sans-serif; font-size:14px;
  padding-inline:18px; padding-block:20px;
}
.wrap{position:relative}

header{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:14px; flex-wrap:wrap}
h1{font-family:"Vollkorn",serif; font-weight:700; font-size:24px; margin:0 0 3px}
.sub{color:var(--muted); font-size:13px; margin:0}
#sub-detail{font-size:13px; color:var(--fg); max-width:640px; margin-top:4px}
#sub-detail p{margin:6px 0 0}
#sub-detail ul{margin:6px 0 0; padding-left:20px}
#sub-detail li{margin:4px 0}
#sub-detail a{color:var(--tag); text-decoration:underline; text-underline-offset:2px}
#sub-detail .scope-contact{font-size:11px; font-style:italic; color:var(--muted); margin:12px 0 0}
.sub-detail dd{margin:2px 0 0; color:var(--fg)}

.toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.omnibar{
  flex:1 1 320px; max-width:520px; border:1px solid var(--line-strong); background:var(--panel);
  color:var(--fg); padding:9px 14px; font:inherit; font-size:13.5px; border-radius:20px;
}
/* while loading: muted text measured only 3.37:1 against the progress
   fill (fails WCAG AA's 4.5:1) -- fg clears 8.57:1 against the fill and
   12.91:1 against the unfilled background, so it's legible either way */
.omnibar:disabled{color:var(--fg); cursor:not-allowed}
.omnibar:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn{
  border:1px solid var(--line-strong); background:var(--panel); color:var(--fg);
  padding:7px 13px; font:inherit; font-weight:600; font-size:12.5px; cursor:pointer; border-radius:6px;
}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn:hover{filter:brightness(0.97)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.table-scroll{overflow-x:auto; border:1px solid var(--line); background:var(--panel); border-radius:8px}
table{border-collapse:collapse; width:max-content; min-width:100%; font-size:13px; white-space:nowrap}
th,td{border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top}
th{font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:var(--panel); position:sticky; top:0; z-index:1; min-width:100px; white-space:nowrap}
/* table-layout:auto (the default) sizes each column from its own content at
   render time, between a 100px floor (short values still get a presentable
   landscape block, not a cramped sliver) and a 300px ceiling (beyond that,
   wrap to a second/third line rather than stretching the row wider) */
td{white-space:normal; max-width:300px}
td.num,.tag-color{color:var(--tag); font-weight:600}

.col-entity, th.col-entity{
  position:sticky; left:0; background:var(--panel); z-index:2; font-weight:700;
  max-width:260px; white-space:normal;
  /* subtle cast-shadow on the frozen column's trailing edge, signifying it
     stays put while the rest of the table scrolls underneath it */
  box-shadow:6px 0 6px -4px rgba(0,0,0,.18);
}
th.col-entity{z-index:3}
.col-entity a{color:var(--fg); text-decoration:none; border-bottom:1px dotted var(--line-strong)}
.col-entity .meta{display:block; color:var(--muted); font-weight:400; font-size:11.5px; margin-top:2px}

.chip{
  display:inline-block; border:1px solid var(--line-strong); background:var(--bg);
  color:var(--muted); font-weight:600; font-size:10.5px; padding:3px 9px; margin:2px 3px 2px 0;
  border-radius:20px; cursor:pointer; user-select:none;
}
.chip:hover{background:var(--line)}
.chip.header-chip{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.chip.header-chip:hover{filter:brightness(1.08)}

.status{font-size:12.5px; color:var(--muted); margin:10px 0 0}
.paper-count{font-size:13px; font-weight:600; color:var(--fg); margin:0 0 8px}
footer{margin-top:18px; font-size:11.5px; color:var(--muted)}

/* ---- omnibar dropdown (search isn't wired yet -- see STUB_RESULTS) ---- */
.omni-wrap{position:relative; flex:1 1 320px; max-width:520px}
.omni-wrap .omnibar{width:100%; max-width:none; padding-left:36px}
.omni-icon{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--muted); pointer-events:none; z-index:2;
}
.omni-icon svg{display:block; width:100%; height:100%}
/* fills left-to-right behind the (transparent-background-while-loading) input,
   so the omnibar itself reads as a 0-100% progress bar during the model download */
.omni-progress{
  position:absolute; inset:0; border-radius:20px; overflow:hidden; pointer-events:none;
}
.omni-progress .fill{
  height:100%; width:0%; background:var(--line); transition:width .15s linear;
}
.omnibar.loading{background:transparent; position:relative; z-index:1}
.dropdown{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:10;
  border:1px solid var(--line-strong); border-radius:10px; background:var(--panel);
  box-shadow:0 4px 14px rgba(0,0,0,.12); max-height:60vh; overflow-y:auto;
}
.tagchip{
  flex:0 0 auto; white-space:nowrap; border:1px solid var(--line-strong);
  font-size:10px; padding:2px 8px; border-radius:10px; color:var(--muted);
}
.eg{padding:9px 12px 10px; cursor:pointer}
.eg:hover{background:var(--bg)}
.eg-head{display:flex; align-items:center; gap:7px; font-size:13px; flex-wrap:wrap}
.eg-head .name{font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.eg-hit{display:flex; align-items:baseline; gap:6px; margin-top:5px; padding-left:14px; font-size:11.5px; color:var(--muted); flex-wrap:wrap}
.eg-hit .snip{color:var(--fg); min-width:0}
.attr-divider{border:none; border-top:1px solid var(--line); margin:7px 16px 0}
.entity-divider{border:none; border-top:1px solid var(--line-strong); margin:0}
.eg-solo .lead{font-size:13px; color:var(--fg)}
.eg-solo .crumb{display:flex; align-items:center; gap:7px; margin-top:4px; padding-left:14px}
.eg-solo .crumb .mid{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; color:var(--muted)}
.dd-footer{padding:8px 12px; font-size:11.5px; text-decoration:underline; color:var(--fg); cursor:pointer; border-top:1px solid var(--line)}
.dd-section-label{padding:6px 12px 2px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-top:1px solid var(--line)}
.dd-empty{padding:14px 12px; font-size:12px; color:var(--muted)}

/* ---- full results page: same row language as the dropdown (.eg etc.),
   just laid out in the block the table normally occupies ---- */
.results-page{border:1px solid var(--line); background:var(--panel); border-radius:8px}
.results-header{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.results-header h2{font-family:"Vollkorn",serif; font-size:16px; margin:0; font-weight:700}
.results-back{background:none; border:none; padding:0; font:inherit; font-size:12.5px; color:var(--tag); text-decoration:underline; text-underline-offset:2px; cursor:pointer}
.results-list .eg, .results-list .eg-solo{border-bottom:1px solid var(--line)}
.results-list .eg:last-child, .results-list .eg-solo:last-child{border-bottom:none}

/* ---- layout + paper detail panel (option C: permanent split, table stays usable) ---- */
.layout{display:flex; gap:14px; align-items:flex-start}
.layout .table-scroll, .layout .results-page{flex:1 1 auto; min-width:0}
.col-entity{cursor:pointer}
.col-entity:hover{text-decoration:underline}
.detail-panel{
  flex:0 0 420px; border:1px solid var(--line-strong); background:var(--panel); border-radius:8px;
  padding:16px; max-height:80vh; overflow-y:auto; position:sticky; top:12px;
}
.detail-panel .close{float:right; cursor:pointer; color:var(--muted); font-size:14px}
.detail-panel h2{font-family:"Vollkorn",serif; font-size:17px; margin:0 24px 10px 0}
.detail-field{margin-top:10px}
.detail-field .flabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
.detail-field .fvalue{margin-top:2px; font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Motion-Tracking Measures in XR-Based Experimental Psychology</h1>
      <p class="sub">A public, editable literature review of motion-tracking studies in VR/AR &mdash; open data, open contributions.</p>
      <div id="sub-detail"></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="omni-wrap">
      <div class="omni-progress" id="omni-progress" hidden><div class="fill" id="omni-progress-fill"></div></div>
      <span class="omni-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
        </svg>
      </span>
      <input class="omnibar" id="omnibar" type="search" placeholder="Search by title, author, or topic&hellip;" autocomplete="off">
      <div class="dropdown" id="dropdown" hidden></div>
    </div>
  </div>

  <p class="paper-count" id="paper-count"></p>

  <div class="layout">
    <div class="table-scroll" id="table-scroll">
      <table id="review-table"><tr><td style="padding:20px">Loading data/statements.csv&hellip;</td></tr></table>
    </div>
    <div class="results-page" id="results-page" hidden></div>
    <div class="detail-panel" id="detail-panel" hidden></div>
  </div>
  <p class="status" id="status"></p>

  <footer>Data: <code>data/statements.csv</code> &mdash; SAEV-format statements, open for anyone to propose a change.</footer>
</div>

<script>
// ---------- minimal RFC4180 CSV parser (handles quoted fields with commas/newlines) ----------
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift();
  return rows.filter(r => r.length === header.length).map(r => {
    const o = {};
    header.forEach((h, i) => o[h] = r[i]);
    return o;
  });
}

// ---------- SAEV well-known UUIDs ----------
const THE_NAME = "acf5cebb-8d80-45ad-9a1f-a3dd48682ef6";
const A_COMPONENT = "90c2b9bb-ff6b-4f84-a29b-7b9e8dcfe04a";
const RESEARCH_PAPER = "efe2d554-61f9-4931-9514-7a3bc2bc0d17";

// default-visible columns (never collapsed to a chip) -- everything else
// about a paper lives behind a chip now, see CHIP_GROUPS
const DEFAULT_COLS = [];

// chip groups -- order matters for display
const CHIP_GROUPS = [
  { chip: "Bibliography", fields: ["anAuthor", "thePublicationDate"] },
  { chip: "Participants", fields: ["theSampleParticipants"] },
  { chip: "Construct", fields: ["anABCDomain", "thePsychConstruct"] },
  { chip: "Apparatus", fields: ["theTrackingSetup", "aTrackedSegment", "theSamplingRate"] },
  { chip: "Linkage", fields: ["aMotionFeature", "aTransformationApproach", "theAnalysisMethod"] },
  { chip: "Duration", fields: ["theDuration"] },
  { chip: "Key Analysis", fields: ["theKeyAnalysis"] },
];
const FIELD_TO_CHIP = {};
CHIP_GROUPS.forEach(g => g.fields.forEach(f => FIELD_TO_CHIP[f] = g.chip));

const FIELD_LABELS = {
  anAuthor: "Author", thePublicationDate: "Year",
  theSampleParticipants: "Participants",
  anABCDomain: "ABC Domain", thePsychConstruct: "Psychological Construct",
  theTrackingSetup: "Tracking Setup", aTrackedSegment: "Tracked Body Segments",
  theSamplingRate: "Sampling Rate (Hz)", aMotionFeature: "Motion Features",
  aTransformationApproach: "Transformation Approach", theAnalysisMethod: "Analysis Method",
  theDuration: "Experiment Duration", theKeyAnalysis: "Key Analysis",
};

// Bibliography + Linkage open by default -- the rest start collapsed to chips
const expanded = new Set(["Bibliography", "Linkage"]);
let currentPapers = [];
let paperEntities = new Set(); // populated in main(); used by search to filter to papers only
let entityNames = {};          // entity -> theName, for ANY entity (papers and schema items alike)
let jumpableFields = new Map(); // schema-item entity -> attribute_name, for ones with a real column to jump to
let exactUnits = [];            // {entity, attribute_name, text}, built in main() -- see EXACT_EXCLUDE there

function render() {
  renderTable(currentPapers);
  document.getElementById("paper-count").textContent =
    currentPapers.length + (currentPapers.length === 1 ? " paper in review" : " papers in review");
}

async function main() {
  const statusEl = document.getElementById("status");
  let text;
  try {
    const res = await fetch("data/statements.csv");
    if (!res.ok) throw new Error("HTTP " + res.status);
    text = await res.text();
  } catch (err) {
    document.getElementById("review-table").innerHTML =
      '<tr><td style="padding:20px">Could not load data/statements.csv (' + err + '). Serve this folder over HTTP, not file://.</td></tr>';
    return;
  }
  const allRows = parseCSV(text);
  statusEl.textContent = allRows.length + " SAEV rows loaded.";

  // aReplacement/anErratum supersede a statement by its own handle -- drop
  // any row whose handle is the *target* of one of those, so a corrected
  // value doesn't show up alongside the value it replaced.
  const deadHandles = new Set(
    allRows.filter(r => r.attribute_name === "aReplacement" || r.attribute_name === "anErratum")
      .map(r => r.entity)
  );
  const rows = allRows.filter(r => !deadHandles.has(r.handle));

  // which entities are tagged ResearchPaper
  paperEntities = new Set(
    rows.filter(r => r.attribute === A_COMPONENT && r.value === RESEARCH_PAPER).map(r => r.entity)
  );
  rows.forEach(r => { if (r.attribute_name === "theName") entityNames[r.entity] = r.value; });
  // schema items (components/attributes) whose own theName IS the attribute_name
  // string (e.g. "aMotionFeature") and that attribute_name has a real chip to
  // jump to -- bib fields like theDOI/anAuthor have no chip, so stay excluded
  // from search exactly as before (nowhere to click through to).
  rows.forEach(r => {
    if (r.attribute_name === "theName" && FIELD_TO_CHIP[r.value]) jumpableFields.set(r.entity, r.value);
  });

  // exact-match index: every string-valued field on a paper or jumpable
  // field entity, including bib fields (author, venue, DOI, ...) that the
  // semantic corpus skips -- this needs no model, so it works immediately,
  // before/even if the embeddings ever finish loading. A jumpable field's
  // own theName (e.g. literal string "aMotionFeature") is skipped -- it's
  // a raw key, not something anyone would type to find it.
  const EXACT_EXCLUDE = new Set(["theProvenance", "anErratum", "thePDFLocation"]);
  rows.forEach(r => {
    if (r.value_type !== "str" || EXACT_EXCLUDE.has(r.attribute_name)) return;
    if (jumpableFields.has(r.entity) && r.attribute_name === "theName") return;
    if (!paperEntities.has(r.entity) && !jumpableFields.has(r.entity)) return;
    exactUnits.push({ entity: r.entity, attribute_name: r.attribute_name, text: r.value });
  });

  // pivot: entity -> attribute_name -> [values]
  const byEntity = {};
  for (const r of rows) {
    if (!paperEntities.has(r.entity)) continue;
    if (!byEntity[r.entity]) byEntity[r.entity] = {};
    if (!byEntity[r.entity][r.attribute_name]) byEntity[r.entity][r.attribute_name] = [];
    byEntity[r.entity][r.attribute_name].push(r.value);
  }

  const papers = Object.keys(byEntity).map(entity => ({
    entity,
    title: (byEntity[entity].theName || ["(untitled)"])[0],
    fields: byEntity[entity],
  })).sort((a, b) => a.title.localeCompare(b.title));

  currentPapers = papers;
  render();
  renderScopeDetail();
  handleHashChange(); // support a deep link straight to #paper/<entity> on initial load
  initSearch(); // fire-and-forget: table is already fully usable, search loads in the background
}

// final inclusion-criteria text from the paper itself (Mannan & Miller 2026) --
// not pulled from statements.csv, which only carries draft/internal intentions
const SCOPE_CRITERIA = [
  "Reports an empirical study that analyzes psychological data from human participants",
  "Tracked participants' body motions with an XR system while in a virtual environment",
  "Related the measures built from the tracked body motion to a construct in affect, behavior, or cognition",
];

const CONTACT_EMAIL = "mmiller30@illinoistech.edu";
const mailto = (subject) => `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}`;

function renderScopeDetail() {
  const el = document.getElementById("sub-detail");
  let html = "<p>A review of research that:</p><ul>";
  SCOPE_CRITERIA.forEach(c => { html += `<li>${esc(c)}</li>`; });
  html += "</ul>";
  html += `<p class="scope-contact">Email me if your interest overlaps and any of (1) `
    + `<a href="${mailto("Alternative inclusion criteria for the Motion & Meaning review")}">you want to add your own criteria as an alternative view</a>, `
    + `(2) <a href="${mailto("Correction request for the Motion & Meaning review")}">you'd want to request a correction to the data as an author or reader</a>, `
    + `or (3) <a href="${mailto("New paper submission for the Motion & Meaning review")}">add a research work by you, or by others</a>.</p>`;
  el.innerHTML = html;
}

function esc(s) { return (s ?? "").toString().replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function joinVals(vals) { return vals ? vals.join("; ") : ""; }

function renderTable(papers) {
  const el = document.getElementById("review-table");
  const collapsedChips = CHIP_GROUPS.filter(g => !expanded.has(g.chip));
  const expandedGroups = CHIP_GROUPS.filter(g => expanded.has(g.chip));

  let thead = "<tr><th class='col-entity'>Paper</th>";
  DEFAULT_COLS.forEach(c => thead += `<th>${esc(c.label)}</th>`);
  thead += "<th>Columns</th>";
  expandedGroups.forEach(g => {
    thead += `<th colspan="${g.fields.length}"><span class="chip header-chip" data-collapse="${esc(g.chip)}">${esc(g.chip)} &times;</span></th>`;
  });
  thead += "</tr>";
  if (expandedGroups.length) {
    thead += "<tr><th class='col-entity'></th>";
    DEFAULT_COLS.forEach(() => thead += "<th></th>");
    thead += "<th></th>";
    expandedGroups.forEach(g => g.fields.forEach(f => thead += `<th>${esc(FIELD_LABELS[f] || f)}</th>`));
    thead += "</tr>";
  }

  let tbody = "";
  for (const p of papers) {
    tbody += `<tr><td class="col-entity" data-entity="${esc(p.entity)}">${esc(p.title)}</td>`;
    DEFAULT_COLS.forEach(c => tbody += `<td>${esc(joinVals(p.fields[c.name]))}</td>`);

    tbody += "<td>";
    collapsedChips.forEach(g => {
      const hasAny = g.fields.some(f => p.fields[f] && p.fields[f].length);
      if (hasAny) tbody += `<span class="chip" data-chip="${esc(g.chip)}">${esc(g.chip)}</span>`;
    });
    tbody += "</td>";

    expandedGroups.forEach(g => g.fields.forEach(f => {
      tbody += `<td>${esc(joinVals(p.fields[f]))}</td>`;
    }));
    tbody += "</tr>";
  }

  el.innerHTML = "<thead>" + thead + "</thead><tbody>" + tbody + "</tbody>";

  el.querySelectorAll(".chip[data-chip]").forEach(chip => {
    chip.addEventListener("click", () => { expanded.add(chip.dataset.chip); render(); });
  });
  el.querySelectorAll(".chip[data-collapse]").forEach(chip => {
    chip.addEventListener("click", () => { expanded.delete(chip.dataset.collapse); render(); });
  });
  el.querySelectorAll(".col-entity[data-entity]").forEach(cell => {
    cell.addEventListener("click", () => openDetail(cell.dataset.entity));
  });
}

// ============================================================
// Paper detail panel (search-ui-options.html, option C: permanent
// split -- table stays visible and usable, detail docks on the right)
// ============================================================

function findPaper(entity) { return currentPapers.find(p => p.entity === entity); }

function openDetail(entity) {
  const p = findPaper(entity);
  if (!p) return;
  location.hash = "paper/" + entity;
}

function closeDetail() {
  if (location.hash.startsWith("#paper/")) location.hash = "";
  else renderDetailPanel(null);
}

function renderDetailPanel(entity) {
  const panelEl = document.getElementById("detail-panel");
  const p = entity ? findPaper(entity) : null;
  if (!p) { panelEl.hidden = true; panelEl.innerHTML = ""; return; }

  // same field order as the table itself: bibliographic defaults first,
  // then every chip group fully expanded -- no sparsity-hiding needed for one paper
  let html = '<span class="close" id="detail-close">&times;</span>';
  html += `<h2>${esc(p.title)}</h2>`;
  DEFAULT_COLS.forEach(c => {
    const v = joinVals(p.fields[c.name]);
    if (!v) return;
    html += `<div class="detail-field"><div class="flabel">${esc(c.label)}</div><div class="fvalue">${esc(v)}</div></div>`;
  });
  CHIP_GROUPS.forEach(g => g.fields.forEach(f => {
    const v = joinVals(p.fields[f]);
    if (!v) return;
    html += `<div class="detail-field"><div class="flabel">${esc(FIELD_LABELS[f] || f)}</div><div class="fvalue">${esc(v)}</div></div>`;
  }));
  panelEl.innerHTML = html;
  panelEl.hidden = false;
  document.getElementById("detail-close").addEventListener("click", closeDetail);
}

function handleHashChange() {
  const searchMatch = location.hash.match(/^#search\/(.+)$/);
  const paperMatch = location.hash.match(/^#paper\/(.+)$/);
  if (searchMatch) {
    const q = decodeURIComponent(searchMatch[1]);
    omnibarEl.value = q;
    renderDetailPanel(null);
    showResultsPage(q);
  } else {
    hideResultsPage();
    renderDetailPanel(paperMatch ? decodeURIComponent(paperMatch[1]) : null);
  }
}
window.addEventListener("hashchange", handleHashChange);

// ============================================================
// Real search: Transformers.js embeds the query live in the browser;
// corpus embeddings are precomputed by the Python pipeline and fetched
// from data/embeddings.json (generated, not committed -- see .gitignore).
// No relevance cutoff by design: the dropdown previews the top 8 entities,
// the full results page (#search/<query>) ranks every entity, however weak
// the score, and the viewer is trusted to judge low scores themselves.
// Quote-syntax exact-text mode is deliberately not built yet.
// Schema-item hits (components/attributes) appear only when they have a
// real chip to jump to (jumpableFields) -- bib fields like theDOI/anAuthor
// have no chip to land on, so stay excluded, same reasoning as before.
// ============================================================

let searchReady = false;
let embedQuery = null;   // async (text) -> number[384], set once the model loads
let corpusUnits = [];    // [{entity, attribute_name, text, vector}], papers + jumpable fields
let resolveSearchReady;
const searchReadyPromise = new Promise(res => { resolveSearchReady = res; });

function cosineSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}

function setOmniProgress(pct) {
  document.getElementById("omni-progress-fill").style.width = pct + "%";
  omnibarEl.placeholder = "Getting search ready… " + Math.round(pct) + "%";
}

// streams the response so the embeddings files get real byte-level progress
// too, same as the model files -- not just a silent fetch that stalls the
// bar at 100%
async function fetchWithProgress(url, onFileProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const total = Number(res.headers.get("content-length")) || 0;
  if (!total || !res.body) { onFileProgress(1, 1); return res.arrayBuffer(); }
  const reader = res.body.getReader();
  const chunks = [];
  let loaded = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.length;
    onFileProgress(loaded, total);
  }
  const buf = new Uint8Array(loaded);
  let o = 0;
  for (const c of chunks) { buf.set(c, o); o += c.length; }
  return buf.buffer;
}

async function fetchJsonWithProgress(url, onFileProgress) {
  const buf = await fetchWithProgress(url, onFileProgress);
  return JSON.parse(new TextDecoder().decode(buf));
}

async function initSearch() {
  omnibarEl.disabled = true;
  omnibarEl.classList.add("loading");
  document.getElementById("omni-progress").hidden = false;
  omnibarEl.placeholder = "Getting search ready…";
  try {
    // one shared map/percentage for every file being downloaded -- the model's
    // own files (tracked by its progress_callback) AND embeddings.json (tracked
    // by hand above), so the bar reflects combined real progress, not just the
    // model's, and never silently stalls at 100% while something else loads
    const fileProgress = new Map();
    const recompute = () => {
      let loaded = 0, total = 0;
      for (const f of fileProgress.values()) { loaded += f.loaded; total += f.total; }
      if (total > 0) setOmniProgress((loaded / total) * 100);
    };
    const trackFile = (key) => (loaded, total) => { fileProgress.set(key, { loaded, total }); recompute(); };

    const manifestPromise = fetchJsonWithProgress("data/embeddings-manifest.json", trackFile("embeddings-manifest.json"));
    const vectorsPromise = fetchWithProgress("data/embeddings.bin", trackFile("embeddings.bin"));
    const transformersMod = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");

    const onModelProgress = (e) => {
      if (e.status !== "progress" || typeof e.total !== "number") return;
      fileProgress.set(e.file, { loaded: e.loaded, total: e.total });
      recompute();
    };
    const extractor = await transformersMod.pipeline(
      "feature-extraction", "Xenova/all-MiniLM-L6-v2", { progress_callback: onModelProgress }
    );
    embedQuery = async (text) => Array.from((await extractor(text, { pooling: "mean", normalize: true })).data);

    const manifest = await manifestPromise;
    const vectorBytes = new Int8Array(await vectorsPromise);
    const dim = manifest.dim;
    // Int8Array views directly into the buffer, no copy, no dequantization --
    // cosineSim is scale-invariant per vector, so the raw int8 components
    // compare correctly against the float32 query vector as-is.
    const allUnits = manifest.units.map((u, i) => ({
      ...u, vector: vectorBytes.subarray(i * dim, (i + 1) * dim),
    }));
    corpusUnits = allUnits.filter(u => paperEntities.has(u.entity) || jumpableFields.has(u.entity));
    setOmniProgress(100);

    searchReady = true;
    omnibarEl.disabled = false;
    omnibarEl.classList.remove("loading");
    document.getElementById("omni-progress").hidden = true;
    omnibarEl.placeholder = "Search by title, author, or topic…";
    resolveSearchReady();
  } catch (err) {
    omnibarEl.classList.remove("loading");
    document.getElementById("omni-progress").hidden = true;
    omnibarEl.placeholder = "Search unavailable";
    console.error("search init failed:", err);
  }
}

function fieldLabel(attr) {
  if (attr === "theName") return "Title";
  if (attr === "theAbstract") return "Abstract";
  if (FIELD_LABELS[attr]) return FIELD_LABELS[attr];
  const dc = DEFAULT_COLS.find(c => c.name === attr);
  return dc ? dc.label : attr;
}

// mirrors the Python grouping exactly: theName never gets a redundant
// subline since the header already shows it; single-hit+name -> header
// only; single-hit+non-name -> snippet-leads "solo" layout. Field (schema-
// item) groups always have exactly one hit (their theIntention unit) and
// are tagged "Column" instead of "Paper" so the click target is obvious.
function buildGroup(entity, hits) {
  const isField = jumpableFields.has(entity);
  const kind = isField ? "Column" : "Paper";
  const title = isField ? (FIELD_LABELS[jumpableFields.get(entity)] || jumpableFields.get(entity))
                         : (entityNames[entity] || "(untitled)");
  if (isField) {
    return { entity, title, kind, solo: { field: "Definition", snip: hits[0].text } };
  }
  if (hits.length === 1 && hits[0].attribute_name === "theName") {
    return { entity, title, kind, hits: [] };
  }
  if (hits.length === 1) {
    return { entity, title, kind, solo: { field: fieldLabel(hits[0].attribute_name), snip: hits[0].text } };
  }
  const nonNameHits = hits.filter(h => h.attribute_name !== "theName");
  return { entity, title, kind, hits: nonNameHits.map(h => ({ field: fieldLabel(h.attribute_name), snip: h.text })) };
}

// scores the whole corpus against q and groups by entity, ranked by each
// entity's best-scoring unit -- no cutoff, every entity that has at least
// one unit appears. Shared by the dropdown preview (sliced to 8) and the
// full results page (shown in full).
async function searchGroups(q) {
  const qVec = await embedQuery(q);
  const byEntity = new Map();
  for (const u of corpusUnits) {
    const score = cosineSim(u.vector, qVec);
    if (!byEntity.has(u.entity)) byEntity.set(u.entity, []);
    byEntity.get(u.entity).push({ ...u, score });
  }
  return [...byEntity.entries()]
    .map(([entity, hits]) => {
      hits.sort((a, b) => b.score - a.score);
      return { entity, hits: hits.slice(0, 3), maxScore: hits[0].score };
    })
    .sort((a, b) => b.maxScore - a.maxScore)
    .map(({ entity, hits }) => buildGroup(entity, hits));
}

// dropdown preview only: ranks the top-`limit` individual CELLS from a
// pre-scored unit list (not top-`limit` papers), then collapses those into
// however many distinct entities that turns out to be, each ordered by its
// own best (max) cell -- a paper with several strong hits can fill
// multiple slots, so fewer than `limit` entities may show. Deliberately
// different from searchGroups'/exactGroups' per-entity ranking, which the
// full results page uses instead.
function topCellsGroups(scoredUnits, limit) {
  const top = scoredUnits.slice().sort((a, b) => b.score - a.score).slice(0, limit);
  const byEntity = new Map();
  for (const u of top) {
    if (!byEntity.has(u.entity)) byEntity.set(u.entity, []);
    byEntity.get(u.entity).push(u);
  }
  return [...byEntity.entries()]
    .map(([entity, hits]) => ({ entity, hits, maxScore: Math.max(...hits.map(h => h.score)) }))
    .sort((a, b) => b.maxScore - a.maxScore)
    .map(({ entity, hits }) => buildGroup(entity, hits));
}

function scoreSemanticUnits(qVec) {
  return corpusUnits.map(u => ({ ...u, score: cosineSim(u.vector, qVec) }));
}

// match concentration: needle length / field length, so an exact whole-
// field match (query equals an author's full name) outranks the same
// needle buried in a long abstract. needle.length <= text.length always,
// since text.includes(needle) is required to appear in the list at all.
function scoreExactUnits(needle) {
  const n = needle.toLowerCase();
  if (!n) return [];
  return exactUnits
    .filter(u => u.text.toLowerCase().includes(n))
    .map(u => ({ ...u, score: n.length / u.text.length }));
}

// ---- exact-match mode: a query starting with a literal " switches to
// plain case-insensitive substring matching over exactUnits (every string
// field, including bib fields the semantic corpus skips). No model needed.
function isExactQuery(q) { return q.trim().startsWith('"'); }
function exactNeedle(q) { return q.trim().slice(1).replace(/"$/, "").trim(); }

function exactGroups(needle) {
  const n = needle.toLowerCase();
  if (!n) return [];
  const byEntity = new Map();
  for (const u of exactUnits) {
    if (!u.text.toLowerCase().includes(n)) continue;
    if (!byEntity.has(u.entity)) byEntity.set(u.entity, []);
    byEntity.get(u.entity).push(u);
  }
  return [...byEntity.entries()]
    .map(([entity, hits]) => {
      // theName first (so a title-only match still gets buildGroup's
      // header-only shortcut), then cap at 3 like the semantic path
      hits.sort((a, b) => (a.attribute_name === "theName" ? -1 : 0) - (b.attribute_name === "theName" ? -1 : 0));
      return [entity, hits.slice(0, 3)];
    })
    .sort((a, b) => {
      const aTitle = a[1].some(h => h.attribute_name === "theName");
      const bTitle = b[1].some(h => h.attribute_name === "theName");
      if (aTitle !== bTitle) return aTitle ? -1 : 1;
      if (a[1].length !== b[1].length) return b[1].length - a[1].length;
      return (entityNames[a[0]] || "").localeCompare(entityNames[b[0]] || "");
    })
    .map(([entity, hits]) => buildGroup(entity, hits));
}

function rowHtml(g) {
  if (g.solo) {
    return `<div class="eg eg-solo" data-entity="${esc(g.entity)}" data-kind="${esc(g.kind)}">`
      + `<div class="lead">&ldquo;${esc(g.solo.snip)}&rdquo;</div>`
      + `<div class="crumb"><span class="tagchip">${esc(g.solo.field)}</span>`
      + `<span class="mid">${esc(g.title)}</span><span class="tagchip">${esc(g.kind)}</span></div></div>`;
  }
  let html = `<div class="eg" data-entity="${esc(g.entity)}" data-kind="${esc(g.kind)}">`
    + `<div class="eg-head"><span class="name">${esc(g.title)}</span><span class="tagchip">${esc(g.kind)}</span></div>`;
  g.hits.forEach((h, j) => {
    if (j > 0) html += '<hr class="attr-divider">';
    html += `<div class="eg-hit"><span class="tagchip">${esc(h.field)}</span><span class="snip">&ldquo;${esc(h.snip)}&rdquo;</span></div>`;
  });
  return html + "</div>";
}

// context "dropdown": always close the dropdown explicitly, since its
// visibility isn't tied to the hash. context "results": a Paper click sets
// #paper/<entity> itself, which already hides the results page via
// handleHashChange -- clearing the hash again afterward would wipe that
// out, so only a Column click (which never touches the hash) needs it done
// explicitly here.
function bindRowClicks(el, context) {
  el.querySelectorAll("[data-entity]").forEach(row => {
    row.addEventListener("click", () => {
      if (row.dataset.kind === "Column") {
        jumpToColumn(row.dataset.entity);
        if (context === "dropdown") closeDropdown();
        else location.hash = "";
      } else {
        openDetail(row.dataset.entity);
        if (context === "dropdown") closeDropdown();
      }
    });
  });
}

// Dropdown preview always blends both match types -- 8 cells of whichever
// type the query emphasizes (exact if quoted, semantic otherwise), plus 2
// cells of the other type as a secondary section. Quoting only swaps which
// type gets the 8 slots; it doesn't turn the other type off.
async function runSearch(q) {
  const quoted = isExactQuery(q);
  const needle = quoted ? exactNeedle(q) : q.trim();

  const exactScored = scoreExactUnits(needle);
  let semanticScored = [];
  if (needle && searchReady) {
    semanticScored = scoreSemanticUnits(await embedQuery(needle));
  }

  const primaryScored = quoted ? exactScored : semanticScored;
  const secondaryScoredAll = quoted ? semanticScored : exactScored;

  const primaryGroups = topCellsGroups(primaryScored, 8);
  const used = new Set(primaryGroups.map(g => g.entity));
  const secondaryGroups = topCellsGroups(secondaryScoredAll.filter(u => !used.has(u.entity)), 2);

  renderDropdown({
    primaryGroups, secondaryGroups,
    secondaryLabel: quoted ? "Related" : "Exact matches",
    q,
  });
}

function renderDropdown(data) {
  const el = document.getElementById("dropdown");
  if (!data.primaryGroups.length && !data.secondaryGroups.length) {
    el.innerHTML = '<div class="dd-empty">No matches.</div>'; el.hidden = false; return;
  }
  let html = "";
  data.primaryGroups.forEach((g, i) => {
    html += rowHtml(g);
    if (i < data.primaryGroups.length - 1) html += '<hr class="entity-divider">';
  });
  if (data.secondaryGroups.length) {
    html += `<div class="dd-section-label">${esc(data.secondaryLabel)}</div>`;
    data.secondaryGroups.forEach((g, i) => {
      html += rowHtml(g);
      if (i < data.secondaryGroups.length - 1) html += '<hr class="entity-divider">';
    });
  }
  // the full results page (#search/<query>) commits to one ranking method
  // uncapped -- not this preview's blended top-8+2 pool -- so no count is
  // shown here to avoid implying a number that wouldn't match
  html += `<div class="dd-footer" id="dd-see-all">See all results &rarr;</div>`;
  el.innerHTML = html;
  el.hidden = false;
  bindRowClicks(el, "dropdown");
  document.getElementById("dd-see-all").addEventListener("click", () => {
    location.hash = "search/" + encodeURIComponent(data.q);
  });
}

function closeDropdown() {
  const el = document.getElementById("dropdown");
  el.hidden = true;
  el.innerHTML = "";
}

// ============================================================
// Full results page: replaces the table in place, ranks every entity in
// the corpus (no cutoff), reached via the dropdown's "see all" link or
// pressing Enter in the omnibar. #search/<query> is deep-linkable.
// ============================================================

async function showResultsPage(q) {
  closeDropdown();
  document.getElementById("table-scroll").hidden = true;
  const el = document.getElementById("results-page");
  el.hidden = false;

  // the results page commits fully to one mode or the other -- a quoted
  // query here means exact results only, no semantic blending, however
  // many (or few) hits that turns out to be. Needs no model, no waiting.
  if (isExactQuery(q)) {
    const groups = exactGroups(exactNeedle(q));
    renderResultsPage(exactNeedle(q), groups, "exact");
    return;
  }

  el.innerHTML = `<div class="results-header"><h2>Searching&hellip;</h2></div>`;
  await searchReadyPromise;
  if (location.hash !== "#search/" + encodeURIComponent(q)) return; // hash moved on while awaiting
  const groups = await searchGroups(q);
  renderResultsPage(q, groups, "semantic");
}

function renderResultsPage(q, groups, mode) {
  const el = document.getElementById("results-page");
  const label = mode === "exact" ? "exact result" : "result";
  let html = `<div class="results-header">`
    + `<h2>${groups.length} ${label}${groups.length === 1 ? "" : "s"} for &ldquo;${esc(q)}&rdquo;</h2>`
    + `<button class="results-back" id="results-back">&larr; Back to table</button></div>`;
  html += '<div class="results-list">';
  if (!groups.length) {
    html += '<div class="dd-empty">No matches.</div>';
  } else {
    groups.forEach(g => { html += rowHtml(g); });
  }
  html += "</div>";
  el.innerHTML = html;
  bindRowClicks(el, "results");
  document.getElementById("results-back").addEventListener("click", () => { location.hash = ""; });
}

function hideResultsPage() {
  document.getElementById("table-scroll").hidden = false;
  const el = document.getElementById("results-page");
  el.hidden = true;
  el.innerHTML = "";
}

// expands the chip containing `attr` and scrolls its column into view --
// used when a search hit is a schema item (a column/field) rather than a paper
function jumpToColumn(entity) {
  const attr = jumpableFields.get(entity);
  const chip = FIELD_TO_CHIP[attr];
  if (!chip) return;
  expanded.add(chip);
  render();
  const label = FIELD_LABELS[attr] || attr;
  requestAnimationFrame(() => {
    const th = Array.from(document.querySelectorAll("#review-table th")).find(t => t.textContent.trim() === label);
    if (th) th.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  });
}

const omnibarEl = document.getElementById("omnibar");
let searchDebounceTimer = null;
omnibarEl.addEventListener("input", () => {
  const q = omnibarEl.value.trim();
  if (!q) { closeDropdown(); return; }
  if (!searchReady) return; // disabled while loading anyway; guards a race on the trailing edge
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => runSearch(q), 250);
});
omnibarEl.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeDropdown(); omnibarEl.blur(); }
  if (e.key === "Enter") {
    const q = omnibarEl.value.trim();
    if (q && searchReady) location.hash = "search/" + encodeURIComponent(q);
  }
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".omni-wrap")) closeDropdown();
});

main();
</script>
